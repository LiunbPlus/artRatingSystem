server {
    listen 80;

    client_max_body_size 500m;

    # 默认地址：没有登录 Cookie 时进入登录页；已有 Cookie 时直接加载首页。
    # Nginx 只判断 Cookie 是否存在，Token 的有效性仍由后端验证。
    location = / {
        if ($cookie_session = "") {
            return 302 /login;
        }

        proxy_pass http://127.0.0.1:7999;
    }

    # Vue 前端及其余前端路由
    location / {
        proxy_pass http://127.0.0.1:7999;
    }

    # Python API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/uploads/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public";
    }
}

server {
    listen 80;

    client_max_body_size 500m;

    # 默认地址统一进入登录页，由前端登录页判断 Token 并决定后续跳转。
    location = / {
        return 302 /login;
    }

    # Vue 前端及其余前端路由
    location / {
        proxy_pass http://127.0.0.1:7999;
    }

    # Python API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/uploads/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public";
    }
}
